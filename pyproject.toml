[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "choice"
version = "0.2.8"
description = "Swipe through a pile and decide."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "bearjcc" }]

[project.optional-dependencies]
images = ["Pillow>=10.0.0"]

[project.scripts]
choice = "choice.cli:main"

[tool.setuptools.packages.find]
include = ["choice*"]

[tool.setuptools.package-data]
choice = ["web/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
