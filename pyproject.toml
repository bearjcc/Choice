[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "choice-swipe"
version = "0.6.10"
description = "Swipe through a pile and decide."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "bearjcc" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
keywords = ["swipe", "review", "photos", "decision"]

[project.optional-dependencies]
images = ["Pillow>=10.0.0"]
heif = ["Pillow>=10.0.0", "pillow-heif>=0.16.0"]
jxl = ["pillow-jxl-plugin>=1.3.0"]

[project.scripts]
choice = "choice.cli:main"

[project.urls]
Homepage = "https://github.com/bearjcc/choice"
Documentation = "https://github.com/bearjcc/choice/blob/main/DECKS.md"

[tool.setuptools.packages.find]
include = ["choice*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
choice = ["web/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
