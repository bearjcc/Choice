# Example Choice config. Copy to choice.toml (gitignored) and edit paths.
# Secrets are env var names, never literal keys.
#
# Environment overrides (see also CLI flags):
#   CHOICE_CONFIG, CHOICE_PATH, CHOICE_HOST, CHOICE_PORT, CHOICE_LAN, CHOICE_OPEN,
#   CHOICE_BASE_PATH, CHOICE_TITLE, CHOICE_STATE_DIR, CHOICE_SECRETS_FILE,
#   CHOICE_USERS_FILE, CHOICE_DISABLE_WARM, CHOICE_SYNC_WORK, CHOICE_CLIENT_BUFFER,
#   CHOICE_PUBLIC_URL, CHOICE_TLS_CERT, CHOICE_TLS_KEY, CHOICE_TRUST_FORWARDED,
#   CHOICE_HTTP_COMPRESS, CHOICE_IMAGE_TRANSCODE, CHOICE_IMAGE_FORMAT, CHOICE_IMAGE_MAX_EDGE,
#   CHOICE_IMAGE_QUALITY, CHOICE_IMAGE_MIN_BYTES, CHOICE_IMAGE_MIN_EDGE, CHOICE_IMAGE_HW_ACCEL

# [client]
# buffer = 30

# Optional tab/header name when several instances share one host (overridable with --title / CHOICE_TITLE).
# title = "Spicy"

[state]
dir = ".choice-state"
# secrets_file = ".choice-secrets"
# users_file = ".choice/users.json"

[[sources]]
id = "examples"
type = "folder"
path = "examples"

[[sources]]
id = "inbox"
type = "folder"
path = "/path/to/photos/inbox"

[[decks]]
id = "yes-no"
title = "Yes or no"
source = "examples"
mount = "yes-no"

# Folder source: results = log only; sort = move files into per-direction folders.
[[decks]]
id = "inbox-sort"
title = "Sort inbox"
source = "inbox"
mount = "."
output = "sort"
recursive = false
include = ["*.jpg", "*.jpeg", "*.png", "*.webp"]
exclude = ["keep/**", "reject/**"]
sort_right = "keep"
sort_left = "reject"
# sort_up = "unsure"

