<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3efe8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<title>Choice</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
  <div class="top-row">
    <button id="back-library" type="button" class="icon-btn nav-back" hidden aria-label="Back to decks">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 6l-6 6 6 6"/></svg>
    </button>
    <h1 id="title">Choice</h1>
    <p id="count" class="count"></p>
    <button id="queue-badge" type="button" class="queue-badge" hidden aria-label="Background queue" data-choice-modal="queue-failures"></button>
    <button id="client-settings" type="button" class="icon-btn" aria-label="Settings" hidden data-choice-modal="client-settings">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.51 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.51-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.51 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
    </button>
    <button id="menu" type="button" class="icon-btn" aria-label="Deck menu" aria-haspopup="true" hidden data-choice-modal="menu">⋯</button>
  </div>
  <div id="filter-bar" class="filter-bar" hidden></div>
  <div class="tools" id="tools" hidden aria-hidden="true">
    <button id="who" type="button">People</button>
    <button id="home" type="button">Decks</button>
    <button id="pending" type="button">Show all</button>
    <button id="blind" type="button" aria-pressed="false">Blind</button>
    <button id="counts" type="button">Counts</button>
  </div>
  <div class="track" id="track" hidden><div id="fill"></div></div>
  </div>
</header>
<main id="main"></main>
<p id="status" class="status" aria-live="polite"></p>
<footer id="actions" class="actions deck-bar" hidden></footer>
<dialog id="dialog" class="app-dialog" aria-labelledby="dialog-title">
  <div class="dialog-shell">
    <div id="dialog-body" class="dialog-body"></div>
  </div>
</dialog>
<script src="dialog_ui.js"></script>
<script src="pile_nav.js"></script>
<script src="swipe_ui.js"></script>
<script src="action_icons.js"></script>
<script src="app.js" defer></script>
</body>
</html>
