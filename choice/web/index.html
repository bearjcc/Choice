<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3efe8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<title>Choice</title>
<link rel="stylesheet" href="design-tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
  <div class="top-row">
    <button id="back-library" type="button" class="icon-btn nav-back" hidden aria-label="Back to decks">
      <span class="icon-slot" data-mdi="back" data-mdi-class="nav-icon" aria-hidden="true"></span>
    </button>
    <h1 id="title">Choice</h1>
    <p id="count" class="count"></p>
    <button id="queue-badge" type="button" class="queue-badge" hidden aria-label="Background queue" data-choice-modal="queue-failures"></button>
    <button id="filter-toggle" type="button" class="icon-btn filter-toggle" hidden aria-label="Filters" aria-expanded="false" aria-controls="filter-panel">
      <span class="icon-slot" data-mdi="filter" data-mdi-class="nav-icon" aria-hidden="true"></span>
      <span id="filter-badge" class="filter-badge" hidden aria-hidden="true"></span>
    </button>
    <button id="client-settings" type="button" class="icon-btn" aria-label="Settings" hidden data-choice-modal="client-settings">
      <span class="icon-slot" data-mdi="settings" data-mdi-class="nav-icon" aria-hidden="true"></span>
    </button>
    <button id="menu" type="button" class="icon-btn" aria-label="Deck menu" aria-haspopup="true" hidden data-choice-modal="menu">
      <span class="icon-slot" data-mdi="menu" data-mdi-class="nav-icon" aria-hidden="true"></span>
    </button>
  </div>
  <button type="button" id="filter-summary" class="filter-summary" hidden></button>
  <div class="tools" id="tools" hidden aria-hidden="true">
    <button id="who" type="button">People</button>
    <button id="home" type="button">Decks</button>
    <button id="pending" type="button">Show all</button>
    <button id="blind" type="button" aria-pressed="false">Blind</button>
    <button id="counts" type="button">Counts</button>
  </div>
  <div class="track" id="track" hidden><div id="fill"></div></div>
  </div>
</header>
<main id="main"></main>
<p id="status" class="status" aria-live="polite"></p>
<footer id="actions" class="actions deck-bar" hidden></footer>
<dialog id="dialog" class="app-dialog" aria-labelledby="dialog-title">
  <div class="dialog-shell">
    <div id="dialog-body" class="dialog-body"></div>
  </div>
</dialog>
<dialog id="filter-panel" class="filter-panel" aria-labelledby="filter-panel-title" aria-modal="true">
  <div class="filter-panel-inner">
    <header class="filter-panel-head">
      <h2 id="filter-panel-title">Filters</h2>
      <button type="button" id="filter-panel-close" class="icon-btn filter-panel-close" aria-label="Close filters">
        <span class="icon-slot" data-mdi="close" data-mdi-class="nav-icon" aria-hidden="true"></span>
      </button>
    </header>
    <div id="filter-panel-body" class="filter-panel-body"></div>
    <footer class="filter-panel-foot">
      <button type="button" id="filter-panel-clear" class="filter-panel-clear">Clear all</button>
      <button type="button" id="filter-panel-apply" class="filter-panel-apply primary">Apply</button>
    </footer>
  </div>
</dialog>
<script src="viewport_sync.js"></script>
<script src="dialog_ui.js"></script>
<script src="dom.js"></script>
<script src="filter_panel_helpers.js"></script>
<script src="filter_panel.js"></script>
<script src="config_deck.js"></script>
<script src="card_meta.js"></script>
<script src="config_ui.js"></script>
<script src="server_admin.js"></script>
<script src="pile_nav.js"></script>
<script src="swipe_ui.js"></script>
<script src="mdi.js"></script>
<script src="action_icons.js"></script>
<script src="app.js" defer></script>
</body>
</html>
