<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3efe8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<title>Choice</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1 id="title">Choice</h1>
    <p id="count" class="count"></p>
    <button id="menu" type="button" class="icon-btn" aria-label="Menu" aria-haspopup="true" hidden>⋯</button>
  </div>
  <div class="tools" id="tools" hidden aria-hidden="true">
    <button id="who" type="button">People</button>
    <button id="home" type="button">Decks</button>
    <button id="pending" type="button">Show all</button>
    <button id="blind" type="button" aria-pressed="false">Blind</button>
    <button id="counts" type="button">Counts</button>
  </div>
  <div class="track" id="track" hidden><div id="fill"></div></div>
</header>
<main id="main"></main>
<p id="status" class="status" aria-live="polite"></p>
<button id="fab-undo" type="button" class="fab" hidden aria-label="Undo last swipe">Undo</button>
<footer id="actions" class="actions sr-phone" hidden></footer>
<dialog id="dialog">
  <div id="dialog-body"></div>
</dialog>
<script src="app.js" defer></script>
</body>
</html>
